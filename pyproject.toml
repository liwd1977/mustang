[project]
name = "mustang-delivery"
version = "0.1.0"
description = "野马集团低代码应用智能交付工作台"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.32",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "openai>=1.30",
    "sqlparse>=0.5",
    "pyyaml>=6.0",
    "Pillow>=10.0",
    "pycryptodome>=3.20",
    "playwright>=1.44",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
